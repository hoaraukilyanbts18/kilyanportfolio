<div class="page-head wide">

  <h1>IA &amp; développement</h1>

  <div id="veille-ia-widget" style="min-height:200px;"></div>
  <p style="text-align:center;font-size:12px;">
    <a href="#" id="veille-secours-lien" style="color:#89b4fa;">Afficher la version de secours (RSS)</a>
  </p>

  <!-- =====script de la veille  ===== -->
  <script>
(function () {
  var VEILLE_URL = "https://hoaraukilyanbts18.github.io/kilyanportfolio/veille-ia.html";
  var GH_OWNER   = "hoaraukilyanbts18";
  var GH_REPO    = "kilyanportfolio";
  var RSS_PATH   = "rss";

  var box = document.getElementById("veille-ia-widget");

  function afficherRSS(motif) {
    box.innerHTML = '<div style="padding:16px;font-family:sans-serif;font-size:12px;color:#f9e2af;">⚠️ ' + motif + ' — chargement du flux RSS de secours…</div>';
    fetch("https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + RSS_PATH)
      .then(function (r) { return r.json(); })
      .then(function (fichiers) {
        if (!Array.isArray(fichiers) || !fichiers.length) throw new Error("no-rss");
        fichiers.sort(function (a, b) { return b.name.localeCompare(a.name); });
        return fetch(fichiers[0].download_url);
      })
      .then(function (r) { return r.text(); })
      .then(function (xmlTexte) {
        var xml   = new DOMParser().parseFromString(xmlTexte, "text/xml");
        var items = xml.querySelectorAll("item");
        var html  = '<div style="padding:16px;font-family:sans-serif;">' +
                    '<div style="font-size:11px;color:#f9e2af;margin-bottom:12px;">⚠️ Site principal indisponible — dernière veille connue (RSS)</div>';
        items.forEach(function (item) {
          var t = item.querySelector("title");
          var l = item.querySelector("link");
          html += '<div style="margin-bottom:8px;padding:8px 10px;border-left:2px solid #45475a;">' +
                  '<a href="' + (l ? l.textContent : "#") + '" target="_blank" style="color:#89b4fa;font-size:13px;text-decoration:none;">' +
                  (t ? t.textContent : "Sans titre") + '</a></div>';
        });
        html += '</div>';
        box.innerHTML = html;
      })
      .catch(function () {
        box.innerHTML = '<div style="padding:16px;color:#f38ba8;font-size:12px;">Veille indisponible pour le moment (site et RSS inaccessibles).</div>';
      });
  }

  var iframe = document.createElement("iframe");
  iframe.src = VEILLE_URL + "?v=" + Date.now();
  iframe.style.width = "100%";
  iframe.style.border = "none";
  iframe.style.display = "block";
  iframe.loading = "lazy";
  iframe.title = "Veille technologique";

  iframe.onload = function () {
    try {
      var doc   = iframe.contentDocument;
      var texte = ((doc.body && doc.body.innerText) || "").toLowerCase();
      if (texte.indexOf("404") !== -1 || texte.indexOf("there isn't a github pages site here") !== -1) {
        afficherRSS("Page introuvable (404)");
        return;
      }
      iframe.style.height = doc.body.scrollHeight + "px";
      box.style.border = "none";
    } catch (e) {
      // domaine différent : impossible de lire le contenu, on garde l'iframe telle quelle
      iframe.style.height = "1600px";
    }
  };
  iframe.onerror = function () { afficherRSS("Page inaccessible"); };

  box.innerHTML = "";
  box.appendChild(iframe);

  document.getElementById("veille-secours-lien").onclick = function (e) {
    e.preventDefault();
    afficherRSS("Basculé manuellement");
  };
})();
</script>
